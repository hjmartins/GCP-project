[project]
name = "telemetry-loader"
version = "0.1.0"
description = "Carrega o lote diário do Bronze (GCS) para o staging no BigQuery e roda o dbt."
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "google-cloud-bigquery>=3.46.1",
]

[project.scripts]
telemetry-loader = "telemetry_loader.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

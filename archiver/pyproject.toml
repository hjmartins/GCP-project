[project]
name = "telemetry-archiver"
version = "0.1.0"
description = "Arquiva a Silver antiga em Apache Iceberg no bucket frio (camada fria)."
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.20",
    "google-cloud-bigquery-storage>=2.24",
    "google-cloud-storage>=2.14",
    "pyiceberg[pyarrow,pyiceberg-core,sql-sqlite]>=0.12.0",
]

[project.scripts]
telemetry-archiver = "telemetry_archiver.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

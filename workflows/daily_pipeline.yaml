# Pipeline diário: gerador (Bronze) → loader (staging + dbt build).
#
# Argumento opcional: {"run_date": "AAAA-MM-DD"}. Sem ele, processa ontem no fuso de Brasília.
# Em caso de falha, grava um log ERROR com event=pipeline_failed (o alerta escuta esse log)
# e a execução termina como FAILED.

main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          # time.format devolve "2026-10-08T06:00:00.000000-03:00"; os 10 primeiros caracteres são a data.
          - run_date: ${text.substring(time.format(sys.now() - 86400, "America/Sao_Paulo"), 0, 10)}

    # Execução sem argumento chega com args = null, por isso a checagem em dois níveis.
    - read_args:
        switch:
          - condition: ${args != null}
            steps:
              - override_run_date:
                  assign:
                    - run_date: ${default(map.get(args, "run_date"), run_date)}

    - run_pipeline:
        try:
          steps:
            # time.parse falha com formato errado ou data inexistente (ex.: 2026-13-45).
            - validate_run_date:
                assign:
                  - parsed_date: ${time.parse(run_date + "T00:00:00Z")}
            - run_generator:
                call: run_job
                args:
                  project: ${project}
                  region: ${region}
                  job: generator
                  run_date: ${run_date}
            - run_loader:
                call: run_job
                args:
                  project: ${project}
                  region: ${region}
                  job: loader
                  run_date: ${run_date}
            - run_archiver:
                call: run_job
                args:
                  project: ${project}
                  region: ${region}
                  job: archiver
                  run_date: ${run_date}
        except:
          as: e
          steps:
            - log_failure:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    event: pipeline_failed
                    run_date: ${run_date}
                    error: ${e}
            - fail:
                raise: ${e}

    - log_success:
        call: sys.log
        args:
          severity: INFO
          json:
            event: pipeline_succeeded
            run_date: ${run_date}

    - done:
        return: ${run_date}

# Executa um Cloud Run Job com RUN_DATE e espera terminar (o connector acompanha a operação).
run_job:
  params: [project, region, job, run_date]
  steps:
    - execute:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: RUN_DATE
                        value: ${run_date}
            connector_params:
              timeout: 3600
          result: execution
        # Retry só para erros transitórios da API (429, 502, 503, conexão). Se o job em si
        # falhar (ex.: teste do dbt), não adianta repetir: o Cloud Run já tentou 2x
        # (max_retries = 1) e o erro sobe para o except do main.
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 3
          backoff:
            initial_delay: 10
            max_delay: 120
            multiplier: 2
    - done:
        return: ${execution}
